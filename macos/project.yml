name: SISR
options:
  bundleIdPrefix: com.timelapsetech
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  SISRKit:
    path: Packages/SISRKit
targets:
  SISR:
    type: application
    platform: macOS
    sources:
      - path: SISR
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timelapsetech.sisr
        PRODUCT_NAME: SISR
        INFOPLIST_FILE: SISR/Info.plist
        CODE_SIGN_ENTITLEMENTS: SISR/SISR.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.0.1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SISRKit
    scheme:
      testTargets: []
